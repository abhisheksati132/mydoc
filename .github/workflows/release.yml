name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (optional, e.g. v1.4.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    # The emulator step is allowed 40 minutes of booting on its own. Without a job cap the whole run
    # would sit on GitHub's 6-hour default when a runner is unhealthy, which is the failure being
    # diagnosed here ("Timeout waiting for emulator to boot").
    timeout-minutes: 150
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
      # Every Gradle call in this job runs against an empty Gradle home on purpose. The dependency pin
      # file was generated on a developer machine whose warm cache and PGP keyring let artifacts pass
      # verification without an entry, and CI's build job reuses a cache that predates the pins, so neither
      # notices a missing one; a cold home here is what proves every artifact the release is built from is
      # pinned and key-verified without a keyserver. Costs a few minutes of downloads, which is the point.

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install pinned Gradle distribution in cold home
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-cold
        run: |
          set -euo pipefail
          DIST_URL=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g' | sed 's/\\//g')
          if [[ "$DIST_URL" != https://services.gradle.org/distributions/gradle-*-bin.zip ]]; then
            echo "ERROR: Unexpected Gradle distribution URL in gradle-wrapper.properties: $DIST_URL"
            exit 1
          fi
          DIST_VERSION="${DIST_URL##*/gradle-}"
          DIST_VERSION="${DIST_VERSION%-bin.zip}"
          if [[ "$DIST_VERSION" != 9.6.0 ]]; then
            echo "ERROR: No checksum pin is configured for Gradle $DIST_VERSION."
            exit 1
          fi
          mkdir -p "$GRADLE_USER_HOME/wrapper/dists/gradle-${DIST_VERSION}-bin/manual"
          archive="$RUNNER_TEMP/gradle-${DIST_VERSION}-bin.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/451669088" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$archive"
          echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  $archive" | sha256sum --check --status
          unzip -q "$archive" -d "$GRADLE_USER_HOME/wrapper/dists/gradle-${DIST_VERSION}-bin/manual"
          rm "$archive"
          test -x "$GRADLE_USER_HOME/wrapper/dists/gradle-${DIST_VERSION}-bin/manual/gradle-${DIST_VERSION}/bin/gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        # Run against an empty Gradle home on purpose: a warm cache or a local keyring lets an
        # artifact pass verification with no entry in the pin file, and the release must not depend
        # on that. $RUNNER_TEMP is per-job, so nothing here is ever reused from a previous release.
        run: |
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-cold" ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Lint
        run: GRADLE_USER_HOME="$RUNNER_TEMP/gradle-cold" ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Determine & Verify Version Tag
        id: vars
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          APP_VERSION=$(grep 'val APP_VERSION_NAME' app/build.gradle.kts | head -1 | cut -d '"' -f2)
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: Could not parse APP_VERSION_NAME from app/build.gradle.kts"
            exit 1
          fi

          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG="$INPUT_TAG_NAME"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${APP_VERSION}"
          fi

          TAG_VERSION="${TAG#v}"
          echo "Comparing tag version '$TAG_VERSION' with gradle APP_VERSION_NAME '$APP_VERSION'..."
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Version tag mismatch! Tag version is '$TAG_VERSION' but APP_VERSION_NAME in app/build.gradle.kts is '$APP_VERSION'."
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore
        run: |
          if [ -z "${{ secrets.MYDOC_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: MYDOC_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          echo "${{ secrets.MYDOC_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "ERROR: Decoded release.jks is empty or failed to decode."
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          MYDOC_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MYDOC_KEYSTORE_PASSWORD: ${{ secrets.MYDOC_KEYSTORE_PASSWORD }}
          MYDOC_KEY_ALIAS: ${{ secrets.MYDOC_KEY_ALIAS }}
          MYDOC_KEY_PASSWORD: ${{ secrets.MYDOC_KEY_PASSWORD }}
          MYDOC_RELEASE_CERT_SHA256: ${{ secrets.MYDOC_RELEASE_CERT_SHA256 }}
        run: |
          if [ -z "$MYDOC_RELEASE_CERT_SHA256" ]; then
            echo "ERROR: Secret MYDOC_RELEASE_CERT_SHA256 is missing or empty! Release builds require a pinned certificate fingerprint to prevent updater failure."
            exit 1
          fi
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-cold" ./gradlew assembleRelease --stacktrace

      - name: Install apksigner
        run: sudo apt-get update -y && sudo apt-get install -y apksigner

      # H-13: every artifact that is about to be published is verified, not only the universal one.
      # A split whose signature nobody checked is a split nobody can attribute to this signing key,
      # and a split whose ABI list was never read is a split that may not contain the ABI its file
      # name promises. Each result is written to release-assets/verification.txt so the published
      # release carries the evidence rather than a promise.
      - name: Verify every published APK
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.MYDOC_RELEASE_CERT_SHA256 }}
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: Secret MYDOC_RELEASE_CERT_SHA256 is missing or empty!"
            exit 1
          fi
          NORMALIZED_EXPECTED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if ! command -v unzip >/dev/null 2>&1; then
            echo "ERROR: unzip is missing, so the native library layout of the release APKs cannot be checked."
            exit 1
          fi
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "ERROR: no release APKs found to verify."
            exit 1
          fi
          mkdir -p release-assets
          : > release-assets/verification.txt
          echo "### APK verification (${#APKS[@]} artifacts)" >> "$GITHUB_STEP_SUMMARY"
          for apk in "${APKS[@]}"; do
            name=$(basename "$apk")
            CERT_OUTPUT=$(apksigner verify --print-certs "$apk")
            ACTUAL=$(echo "$CERT_OUTPUT" | grep -i "Signer #1 certificate SHA-256 digest:" | head -1 | awk '{print $NF}' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
            if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$NORMALIZED_EXPECTED" ]; then
              echo "CRITICAL SECURITY FAILURE: $name is signed by '${ACTUAL:-nothing}', expected $NORMALIZED_EXPECTED."
              exit 1
            fi
            ABIS=$(unzip -Z1 "$apk" 2>/dev/null | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ',' | sed 's/,$//' || true)
            if [ -z "$ABIS" ]; then
              echo "ERROR: $name carries no native libraries at all (no lib/<abi>/ entries)."
              exit 1
            fi
            # A split has to carry the ABI its filename promises. The universal APK is not named after any
            # single ABI, and it is the artifact most people download, so it is checked against all three
            # rather than falling into a catch-all - the first version of this step did exactly that and
            # failed the release on an APK that was carrying every ABI.
            case "$name" in
              *arm64-v8a*) EXPECTED_ABIS="arm64-v8a" ;;
              *armeabi-v7a*) EXPECTED_ABIS="armeabi-v7a" ;;
              *x86_64*) EXPECTED_ABIS="x86_64" ;;
              *universal*) EXPECTED_ABIS="arm64-v8a armeabi-v7a x86_64" ;;
              *)
                echo "ERROR: $name is not one of the four release artifacts this workflow publishes."
                exit 1
                ;;
            esac
            for want in $EXPECTED_ABIS; do
              case ",$ABIS," in
                *",$want,"*) ;;
                *)
                  echo "ERROR: $name must carry $want native libraries but carries only ($ABIS)."
                  exit 1
                  ;;
              esac
            done
            LINE="$name signed_by=$ACTUAL abis=$ABIS"
            if [ -n "$AAPT2" ]; then
              BADGE=$("$AAPT2" dump badging "$apk")
              PACKAGE=$(echo "$BADGE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
              VN=$(echo "$BADGE" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -1)
              VC=$(echo "$BADGE" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)
              if [ "$PACKAGE" != "com.abhisheksati.mydoc" ]; then
                echo "ERROR: $name declares package '$PACKAGE'."
                exit 1
              fi
              if [ -n "${RELEASE_TAG#v}" ] && [ "$VN" != "${RELEASE_TAG#v}" ]; then
                echo "ERROR: $name declares versionName '$VN' but the tag is '$RELEASE_TAG'."
                exit 1
              fi
              LINE="$LINE package=$PACKAGE versionName=$VN versionCode=$VC"
            else
              echo "::warning::aapt2 was not on the runner; package and version metadata for $name were not verified."
            fi
            echo "$LINE" >> release-assets/verification.txt
            echo "- \`$name\`: signature OK, ABIs \`$ABIS\`" >> "$GITHUB_STEP_SUMMARY"
          done
          cat release-assets/verification.txt

      # A boot timeout and a download timeout look identical from the outside: the action installs the
      # system image if it is missing, so the first run on a fresh runner spends part of the boot
      # budget pulling ~1 GB. Install it as its own step so the 40 minutes below buys booting only.
      # Failure here is not fatal — the emulator step would have done the same download anyway.
      # This is the step whose absence made every release smoke test time out. The runner's /dev/kvm
      # is `crw-rw---- root kvm` and the CI user is not in that group, so without this the emulator
      # starts with "-accel off" (measured: the launch line in the job log), an API 35 x86_64 image
      # cannot boot usefully in software emulation, and the step dies with "Timeout waiting for
      # emulator to boot" - which looks like flaky infrastructure but is deterministic. The build
      # workflow has had this step all along, which is why its instrumented job boots in ~40s while
      # the release job never did. The action's own `enable-kvm` input does not do this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pre-install the API 35 x86_64 system image
        continue-on-error: true
        run: |
          set -uo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; the emulator step will install the image itself."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "system-images;android-35;google_apis;x86_64"

      # A signed, cert-verified APK is not proof it runs. R8 shrinking, release-only resource
      # stripping and the release signing config can all break the app at first launch, and that
      # is exactly what users meet. Nothing is published until this passes.
      # First boot of an API 35 image on a shared runner is slow: the system image is not always
      # pre-installed, so it is downloaded and then cold-booted. The action's own default is 600s,
      # which is what this step ran with the first time it existed and it timed out. The timeout is
      # stated explicitly and the AVD is created without a snapshot so nothing is reused or cached
      # between runs; if it still times out, the launch line above shows whether KVM was granted.
      - name: Smoke test the signed release APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        continue-on-error: true
        id: smoke
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          timeout: 2400
          disable-animations: true
          snapshot: false
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One line, because the action executes each line of this input in its own `sh -c` - a loop
          # written inline cannot survive that (measured: "sh: 1: Syntax error: end of file unexpected"
          # on the `for APK in ...` line). The test itself lives in scripts/release-smoke.sh.
          script: bash scripts/release-smoke.sh

      # The step above is allowed to fail so this can tell the two failures apart. A release must
      # not be published on an untested artifact either way, but the reason decides what to do
      # next: a boot timeout is retried, a crash is fixed.
      - name: Judge the smoke test result
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "Smoke test passed."
            exit 0
          fi
          echo "::error::The release APK smoke test did not pass."
          echo "Read the emulator launch line above before retrying: '-accel off' means KVM was not"
          echo "granted (the Enable KVM step is missing or stopped working) and a retry cannot help."
          echo "Otherwise 'Timeout waiting for emulator to boot' is runner capacity, and a FATAL"
          echo "EXCEPTION is this build and must be fixed."
          exit 1

      # "Timeout waiting for emulator to boot" is nearly always one of three things on a shared
      # runner: no KVM device, a saturated host, or a disk that filled mid-boot. None of that is in
      # the step log today, so a retry tells you nothing about whether the next retry will work.
      # Collected only when the smoke test failed, and nothing here is allowed to mask that failure.
      - name: Collect emulator diagnostics
        if: failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "## KVM"
            ls -l /dev/kvm 2>&1 || true
            egrep -c '(vmx|svm)' /proc/cpuinfo 2>&1 || true
            echo "## CPU / memory / disk"
            nproc; free -m; df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            echo "## qemu processes"
            ps aux | grep -i "[q]emu\|[e]mulator" || echo "no emulator process survived"
            echo "## adb state"
            adb devices -l 2>&1 || true
            adb shell getprop sys.boot_completed 2>&1 || true
            adb shell getprop ro.build.fingerprint 2>&1 || true
            echo "## last kernel messages"
            sudo dmesg -T 2>/dev/null | tail -n 120 || echo "dmesg unavailable"
            echo "## emulator logs"
            find "$HOME/.android/avd" -maxdepth 2 -name '*.log' -o -maxdepth 2 -name 'config.ini' \
              -print 2>/dev/null | head -20 || true
          } > emulator-diagnostics.txt 2>&1
          tail -n 60 emulator-diagnostics.txt

      - name: Upload Release Smoke Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-smoke-evidence
          path: |
            release-smoke-*.png
            emulator-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare Release Assets
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-assets/mydoc-${TAG}-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk release-assets/mydoc-${TAG}-armeabi-v7a.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk release-assets/mydoc-${TAG}-x86_64.apk
          cp app/build/outputs/apk/release/app-universal-release.apk release-assets/mydoc-${TAG}-universal.apk
          cp app/build/outputs/apk/release/app-universal-release.apk release-assets/mydoc-${TAG}.apk
          cd release-assets
          for f in mydoc-*.apk; do
            sha256sum "$f" > "${f}.sha256"
          done
          ls -lh
          cd ..

          # Lead with the curated changes for this version, before verification evidence.
          awk -v heading="## [${TAG#v}]" 'index($0, heading)==1 {copy=1; next} copy && /^## \[/ {exit} copy {print}' CHANGELOG.md > release-assets/release-body.md

          # H-11: the README tells people to compare the certificate fingerprint against a value
          # published with the release, so the release publishes it. The value is the one apksigner
          # read off these artifacts in the verification step, not a hand-copied constant.
          {
            echo "## Integrity"
            echo
            echo "Signing certificate SHA-256 of every artifact below, as verified by CI:"
            echo
            echo '```'
            cut -d' ' -f2 release-assets/verification.txt | sed 's/signed_by=/  /' | sort -u
            echo '```'
            echo
            echo "Check your download with \`sha256sum -c mydoc-*.apk.sha256\`, and the signer with"
            echo "\`apksigner verify --print-certs mydoc-*.apk\`."
            echo
            echo "## What CI ran"
            echo
            if [ -s release-assets/smoke.txt ]; then
              sed 's/^/- /' release-assets/smoke.txt
            else
              echo "- No smoke-test evidence: the emulator step did not complete, so nothing here is executed-verified."
            fi
          } >> release-assets/release-body.md
          cat release-assets/release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: mydoc ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: release-assets/release-body.md
          files: |
            release-assets/mydoc-*.apk
            release-assets/mydoc-*.apk.sha256
            release-assets/verification.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Release Keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          echo "Cleaned up temporary release keystore file."
