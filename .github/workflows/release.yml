name: Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (optional, e.g. v1.0.1)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Determine Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            COUNT=$(git rev-list --count HEAD)
            TAG="v1.0.${COUNT}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download & Embed Official LibreOffice Engine
        run: |
          echo "Downloading official LibreOffice Android package from F-Droid repository..."
          wget -q https://f-droid.org/repo/org.documentfoundation.libreoffice_131.apk -O libreoffice.apk
          ls -lh libreoffice.apk

          echo "Unpacking native arm64-v8a libraries..."
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -q -j libreoffice.apk 'lib/arm64-v8a/*.so' -d app/src/main/jniLibs/arm64-v8a/

          echo "Unpacking LibreOffice runtime configuration assets..."
          mkdir -p app/src/main/assets
          unzip -q libreoffice.apk 'assets/program/*' 'assets/share/*' -d temp_assets/
          cp -r temp_assets/assets/* app/src/main/assets/

          echo "Cleaning up temporary files..."
          rm -rf libreoffice.apk temp_assets

          echo "Verifying unpacked native libraries:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Build Signed Release APK with Built-in LibreOffice Engine
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Assets
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/mydoc-${TAG}.apk
          cd release-assets
          sha256sum mydoc-${TAG}.apk > mydoc-${TAG}.apk.sha256
          cat mydoc-${TAG}.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: mydoc ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/mydoc-*.apk
            release-assets/mydoc-*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
