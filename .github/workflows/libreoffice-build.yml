name: Build LibreOffice-Powered APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-libreoffice:
    name: Package & Build LibreOffice Engine APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Official LibreOffice Engine
        run: |
          echo "Downloading official LibreOffice Android package from F-Droid repository..."
          wget -q https://f-droid.org/repo/org.documentfoundation.libreoffice_131.apk -O libreoffice.apk
          ls -lh libreoffice.apk

      - name: Extract Native Libraries & Assets
        run: |
          echo "Unpacking native arm64-v8a libraries..."
          mkdir -p app/src/main/jniLibs/arm64-v8a
          unzip -q -j libreoffice.apk 'lib/arm64-v8a/*.so' -d app/src/main/jniLibs/arm64-v8a/

          echo "Unpacking LibreOffice runtime configuration assets..."
          mkdir -p app/src/main/assets
          unzip -q libreoffice.apk 'assets/program/*' 'assets/share/*' -d temp_assets/
          cp -r temp_assets/assets/* app/src/main/assets/

          echo "Cleaning up temporary files..."
          rm -rf libreoffice.apk temp_assets

          echo "Verifying unpacked native libraries:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build LibreOffice-Powered APKs
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Determine Version Tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            COUNT=$(git rev-list --count HEAD)
            TAG="v1.0.${COUNT}-libreoffice"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Assets
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/mydoc-libreoffice-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/mydoc-libreoffice-release.apk
          cd release-assets
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydoc-libreoffice-apks
          path: release-assets/
          retention-days: 14

      - name: Publish GitHub Release with LibreOffice Engine
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: mydoc ${{ steps.vars.outputs.tag }} (LibreOffice Engine)
          files: release-assets/*
          draft: false
          prerelease: false
